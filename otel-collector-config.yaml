receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  resource:
    attributes:
      - key: service.namespace
        value: frankenphp-otel-demo
        action: upsert

extensions:
  basicauth/grafanacloud:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}

exporters:
  # Always on, so you can see spans/metrics flowing even before Grafana
  # Cloud credentials are configured in .env.
  debug:
    verbosity: basic

  otlphttp/grafanacloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafanacloud

service:
  extensions: [basicauth/grafanacloud]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/grafanacloud]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/grafanacloud]
